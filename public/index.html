<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Загрузка видео</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #707579);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center; gap: 16px;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--hint); }
  .card { background: var(--card); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
  button {
    width: 100%; min-height: 48px; border: 0; border-radius: 10px;
    background: var(--btn); color: var(--btn-text); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .bar { height: 8px; background: rgba(127,127,127,.25); border-radius: 99px; overflow: hidden; display: none; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--btn); transition: width .15s; }
  #status { min-height: 1.4em; }
  .err { color: #d33; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1>Видео для анализа</h1>
  <p>Выберите ролик — после загрузки результат придёт в чат.</p>
  <div class="card">
    <input id="file" type="file" accept="video/*">
    <button id="pick">Выбрать видео</button>
    <div id="name" style="word-break:break-all"></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div id="status"></div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();

  const $ = (id) => document.getElementById(id);
  const pick = $("pick"), input = $("file"), bar = $("bar"), fill = $("fill"), status = $("status");

  function setStatus(text, isErr) {
    status.textContent = text;
    status.className = isErr ? "err" : "";
  }

  pick.addEventListener("click", () => input.click());

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    if (!tg?.initData) { setStatus("Откройте страницу кнопкой из чата с ботом.", true); return; }

    $("name").textContent = `${file.name} · ${(file.size / 1048576).toFixed(1)} МБ`;
    pick.disabled = true;
    bar.style.display = "block";
    setStatus("Загрузка…");

    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/api/upload");
    xhr.setRequestHeader("x-init-data", tg.initData);
    xhr.setRequestHeader("x-file-name", encodeURIComponent(file.name));
    xhr.setRequestHeader("content-type", file.type || "video/mp4");

    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = Math.round((e.loaded / e.total) * 100);
      fill.style.width = p + "%";
      setStatus(`Загрузка… ${p}%`);
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        fill.style.width = "100%";
        setStatus("Готово. Анализ запущен — ответ придёт в чат.");
        setTimeout(() => tg?.close(), 1500);
      } else {
        let msg = "Ошибка загрузки";
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch {}
        setStatus(msg, true); pick.disabled = false;
      }
    };
    xhr.onerror = () => { setStatus("Сеть недоступна, попробуйте ещё раз", true); pick.disabled = false; };
    const resume = new URLSearchParams(location.search).get("r");
if (resume) xhr.setRequestHeader("x-resume-url", encodeURIComponent(resume));
    xhr.send(file);
  });
</script>
</body>
</html>
